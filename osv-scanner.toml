# uuid 8.3.2, through jayson (@solana/web3.js). Moderate; pnpm audit (high) never fails on it.
[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-02-19
reason = "Moderate. uuid v3(), v5() and v6() skip the bounds check on an output buffer the caller passes (fixed in 11.1.1). Its only dependent, jayson 4.3.0, calls only v4() with no arguments, and no Horagon source imports uuid."

# stream-json 1.9.1, through jayson (@solana/web3.js). Moderate; pnpm audit (high) never fails on them.
[[IgnoredVulns]]
id = "GHSA-528h-pc64-c93x"
ignoreUntil = 2027-02-19
reason = "Moderate. stream-json's pick, ignore, filter and replace path filters take O(depth^2) time (fixed in 3.5.0). Its only dependent, jayson 4.3.0, requires it only in lib/utils.js, while every @solana/web3.js build loads jayson/lib/client/browser, which requires only uuid and lib/generateRequest.js (uuid only), and no Horagon source imports stream-json."

[[IgnoredVulns]]
id = "GHSA-hqr4-qq8f-hg3x"
ignoreUntil = 2027-02-19
reason = "Moderate. stream-json's JSONC parser and verifier re-scan a comment on every chunk (fixed in 3.6.0). Its only dependent, jayson 4.3.0, requires it only in lib/utils.js, while every @solana/web3.js build loads jayson/lib/client/browser, which requires only uuid and lib/generateRequest.js (uuid only), and no Horagon source imports stream-json."

[[IgnoredVulns]]
id = "GHSA-mjw6-4jj6-33hc"
ignoreUntil = 2027-02-19
reason = "Moderate. stream-json's Assembler allows prototype pollution through a __proto__ key (fixed in 3.6.0). Its only dependent, jayson 4.3.0, requires it only in lib/utils.js, while every @solana/web3.js build loads jayson/lib/client/browser, which requires only uuid and lib/generateRequest.js (uuid only), and no Horagon source imports stream-json."

