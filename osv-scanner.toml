# is looked at again: when `ignoreUntil` passes, the job fails on it until it is renewed or fixed.
# The list came from one OSV querybatch over every package of pnpm-lock.yaml and Cargo.lock.

# bigint-buffer 1.1.5, through @solana/spl-token (web3.js 1.x line).
[[IgnoredVulns]]
id = "GHSA-3gc7-fjrx-p6mg"
ignoreUntil = 2027-02-19
reason = "bigint-buffer 1.1.5 via @solana/spl-token: no fixed release exists for the web3.js 1.x line; it decodes u64 fields of accounts returned by the RPC, never user input"

