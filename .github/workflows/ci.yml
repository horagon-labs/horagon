name: ci

on:
  push:
    branches: [main, tier2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `next build` (apps/web) sends no telemetry from CI.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: lint, typecheck, test, build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Node the keeper runs on; local development may use a newer one (docs/dev-setup.md).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every package's `test` script is `vitest run --coverage` with its floors, @horagon/sdk's
      # included, exactly as in `pnpm check`. "bigint: Failed to load bindings, pure JS will be
      # used" on stderr is expected and harmless (docs/dev-setup.md).
      - run: pnpm test
      - run: pnpm build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The MIT gitleaks CLI, pinned by version and checksum: the gitleaks action needs a license
      # for an organization's repository. Scans the full history (fetch-depth: 0) with the default
      # rules plus .gitleaks.toml, and prints each finding with its secret redacted.
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  security:
    name: osv-scanner, pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Accepted advisories, each with its reason and expiry: osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Accepted advisories are listed in package.json (pnpm.auditConfig) and docs/security.md.
      - run: pnpm audit --prod --audit-level high
