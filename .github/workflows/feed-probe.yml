name: feed-probe

# Spike S4 from a datacenter IP: can GitHub-hosted runners read the NBA CDN and ESPN?
# Manual only. The result JSON is uploaded as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Results are committed under spikes/results/, so drop any earlier run of this probe:
      # the artifact must carry only this run's file.
      - run: rm -f spikes/results/s4-probe-github-actions-*.json
      - run: pnpm --filter @horagon/spikes s4:probe
        env:
          HORAGON_PROBE_SITE: github-actions
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feed-probe
          path: spikes/results/s4-probe-github-actions-*.json
