# gitleaks config for CI (.github/workflows/ci.yml): the default rules, plus one allowlist.
# The generic-api-key rule reads `FOO_KEY = 'horagon.foo.v1'` as a secret. Those values are
# browser localStorage key names (apps/web/lib/*.ts), not credentials. Only a secret that is
# nothing but a dotted horagon.* name is allowed, so a real token is still a finding.
[extend]
useDefault = true

[[allowlists]]
description = "localStorage key names such as horagon.burner.v1.previous"
regexTarget = "secret"
regexes = ['''^horagon(\.[a-z0-9]+)+$''']
